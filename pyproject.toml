[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hatchup-payment-service-integration"
version = "0.3.0"
description = "Python SDK for integrating with the Hatchup Payment Service."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<4.0"
authors = [{ name = "Hatchup" }]
keywords = ["hatchup", "payments", "stripe", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<0.29",
  "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
django = [
  "django>=4.2",
  "djangorestframework>=3.14",
]

[project.urls]
Homepage = "https://github.com/hatchup-io/payment-service-integration"
Repository = "https://github.com/hatchup-io/payment-service-integration"
Issues = "https://github.com/hatchup-io/payment-service-integration/issues"

[dependency-groups]
dev = [
  "pre-commit>=4.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "respx>=0.21",
  # Pulled in for the Django-integration tests; the SDK core does not import Django.
  "django>=4.2",
  "djangorestframework>=3.14",
  "pytest-django>=4.9",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/hatchup_psip"]

[tool.hatch.build.targets.sdist]
include = [
  "src/hatchup_psip",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "tests.django.settings"
markers = [
  "live: integration tests that hit a running payment-system (skipped by default)",
]

[tool.coverage.run]
source = ["src/hatchup_psip"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_any_generics = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# Django + DRF don't ship type stubs in the dev-dep set, so relax strict subclassing
# and decorator rules for the optional Django integration. Keeps the rest of the
# SDK on full mypy strict.
[[tool.mypy.overrides]]
module = "hatchup_psip.django.*"
disallow_subclassing_any = false
disallow_untyped_decorators = false

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "F",
  "E",
  "W",
  "I",
  "N",
  "UP",
  "S",
  "B",
  "A",
  "C4",
  "ISC",
  "PIE",
  "PT",
  "Q",
  "RET",
  "SIM",
  "TID",
  "PTH",
  "PL",
  "RUF",
]
ignore = [
  "S101",    # asserts (used in tests)
  "RUF012",  # mutable class attributes
  "PLR0911", # too many returns
  "PLR0913", # too many args
  "PLR2004", # magic numbers
  "S105",    # hardcoded password (test defaults)
  "S106",    # hardcoded password (test defaults)
  "RUF005",  # unpacking style — opinionated
  "RET504",  # unnecessary assignment before return — opinionated
  "SIM108",  # ternary vs if/else — opinionated
  "SIM102",  # nested if — sometimes clearer
  "UP042",   # str+Enum vs StrEnum — both fine
]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F403", "F405"]
"tests/*" = ["S101", "S106", "PLR2004"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["hatchup_psip"]
